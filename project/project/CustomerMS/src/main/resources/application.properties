server.port=3336
spring.application.name=CustomerMS
## MySQL settings
spring.datasource.url=jdbc:mysql://localhost:3306/EKART_CUSTOMER?useSSL=false

#
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
server.servlet.context-path=/Ekart
#
#
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.whitelabel.enabled=false
logging.level.org.hibernate.type=info
#
##hibernate
spring.jpa.properties.hibernate.show_sql: true

spring.cloud.consul.discovery.health-check-url=http://localhost:${server.port}${server.servlet.context-path}/actuator

## Schema managed by Hibernate during active development (no migration tool in place yet)
spring.jpa.hibernate.ddl-auto=update

## Security
# Shared secret the Gateway attaches to every proxied request; downstream services reject
# requests that don't carry it so this service can't be reached directly, bypassing the Gateway.
gateway.shared-secret=${GATEWAY_SHARED_SECRET:mithai-junction-dev-gateway-secret}
# HS256 signing secret for JWTs issued at login. Must match the same value configured on EkartGateway.
jwt.secret=${JWT_SECRET:mithai-junction-dev-jwt-secret-change-me-please-32bytes}
jwt.access-token-expiry-minutes=45
jwt.refresh-token-expiry-days=14

## Store info (single storefront)
mithai-junction.pickup-store-location=Mithai Junction - MG Road, Bengaluru

