server.port=3337
spring.application.name=PaymentMS
# MySQL settings
spring.datasource.url=jdbc:mysql://localhost:3306/EKART_PAYMENT?useSSL=false
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
server.servlet.context-path=/Ekart

#
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.whitelabel.enabled=false
logging.level.org.hibernate.type=info
#
##hibernate
spring.jpa.properties.hibernate.show_sql: true

spring.cloud.consul.discovery.health-check-url=http://localhost:${server.port}${server.servlet.context-path}/actuator

## Schema managed by Hibernate during active development (no migration tool in place yet)
spring.jpa.hibernate.ddl-auto=update

## Security
# Shared secret the Gateway (and sibling services calling this one directly) must present.
gateway.shared-secret=${GATEWAY_SHARED_SECRET:mithai-junction-dev-gateway-secret}

## Razorpay (test/sandbox mode). Get real test keys from https://dashboard.razorpay.com
## (Settings > API Keys) and set them via env vars — never commit real keys. The placeholder
## values below will compile and start the service but any real create-order call will fail
## against Razorpay's API until real test keys are supplied.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder_key_id}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_key_secret_change_me}

